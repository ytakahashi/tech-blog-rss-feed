name: Generate lite feed

# Generates only the lite feed and publishes it with GitHub Pages
# (https://ytakahashi.github.io/tech-blog-rss-feed/feeds/lite.xml).
# The upstream workflows that build the site (generate-feed.yml) and check the external feeds
# (external-test.yml) are deleted in this fork.

on:
  push:
    branches: [ main ]
  schedule:
    # Every 2 hours, off the top of the hour when scheduled runs tend to be delayed.
    # Not more often than upstream, as this fork crawls the same blogs on its own.
    - cron: 30 */2 * * *
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-lite-feed
  cancel-in-progress: true

jobs:
  generate-lite-feed:
    name: Generate lite feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/restore-feed-cache
      - run: npm run cache-prune
      - run: npm run lite-feed-generate
      - uses: ./.github/actions/save-feed-cache
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
